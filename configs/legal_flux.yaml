project:
  seed: 20260619
  run_name: diagnostic

model:
  provider: ollama
  base_url: http://127.0.0.1:11434
  name: qwen3.5:9b
  context_length: 16384
  temperature: 0.0
  seed: 20260619
  analysis_max_tokens: 1600
  flux_plan_max_tokens: 1400
  flux_step_max_tokens: 1400
  flux_review_max_tokens: 1000
  timeout_seconds: 600
  concurrency: 1

legal_flux:
  smoke_cases: 5
  split_fractions:
    template_source: 0.20
    planner_train: 0.50
    trajectory_dev: 0.15
    final_test: 0.15
  template_pool_target: 200-300
  max_steps: 4
  planner_train_samples: 4
  planner_train_temperature: 0.7
  planner_train_conditions:
    - flux_rf_style
  rf_retrieval_backend: ollama_embedding
  rf_embedding_model: bge-m3:latest
  rf_sentence_transformer_model: BAAI/bge-m3
  rf_embedding_cache_file: data/processed/legal_flux/rf_template_embeddings_bge_m3.json
  rf_embedding_timeout_seconds: 600
  rf_tag_example_limit: 36
  include_authority_input: true
  force_binary_final_decision: true
  max_input_characters: 12000
  decision_overlap_ngram: 6
  decision_overlap_threshold: 0.12
  screen_explicit_outcome_leakage: false
  include_all_domains: true
  strict_fact_language_filter: false
  exclude_existing_legalhk_only_cases: false
  prior_legalhk_cases_file: data/processed/legalhk_only/cases.jsonl
  template_pool_file: templates/legal_flux_templates_v0.jsonl
  planner_model:
  executor_model:
  reviewer_model:
  template_export_dir: reports/legal_flux/template_distillation
  chatgpt_batch_dir: reports/legal_flux/template_distillation/azure_gpt56_batches
  deepseek_template_dir: reports/legal_flux/template_distillation/deepseek_api
  gemini_template_dir: reports/legal_flux/template_distillation/gemini_api
  chatgpt_homogeneous_batches: 40
  chatgpt_mixed_batches: 10
  chatgpt_cases_per_batch: 80
  template_batch_full_coverage: true
  freeze_manifest_file: data/processed/legal_flux/legal_flux_frozen_manifest.json
  conditions:
    - direct
    - structured
    - flux_rf_style

xsim:
  dense_model: BAAI/bge-m3
  reranker_model: BAAI/bge-reranker-v2-m3
  device:
  max_length: 8192
  dense_batch_size: 8
  reranker_batch_size: 8
  dense_top_k: 50
  final_top_k: 2
  embeddings_file: planner_train_bge_m3_embeddings.npy
  case_index_file: planner_train_embedding_cases.json
  dense_candidates_file: xsim_dense_top50.jsonl
  neighbors_file: xsim_neighbors.jsonl
  manifest_file: xsim_manifest.json

dpo:
  samples_per_anchor: 4
  planner_model:
  executor_model:
  planner_temperature: 0.7
  seed: 20260619
  candidates_file: trajectory_candidates.jsonl
  evaluations_file: trajectory_evaluations.jsonl
  manifest_file: trajectory_collection_manifest.json

training:
  template_sft:
    model_name_or_path: Qwen/Qwen3.5-9B
    output_dir: runs/legal_flux/training/template_structure_sft
    finetuning_type: lora
    eval_fraction: 0.0
    num_train_epochs: 6
    learning_rate: 0.0001
    per_device_train_batch_size: 1
    per_device_eval_batch_size: 1
    gradient_accumulation_steps: 16
    warmup_ratio: 0.05
    weight_decay: 0.01
    max_grad_norm: 1.0
    max_length: 1024
    gradient_checkpointing: true
    bf16: true
    tf32: true
    save_total_limit: 6
    logging_steps: 5
    dataset_num_proc: 4
    report_to: none
    trust_remote_code: false
    attn_implementation: sdpa
    lora_r: 32
    lora_alpha: 64
    lora_dropout: 0.05
    lora_target_modules: all-linear
    lora_exclude_modules:
      - visual
      - vision_model
      - vision_tower
      - merger

audit:
  provider: none

deepseek:
  api_key_env: DEEPSEEK_API_KEY
  base_url: https://api.deepseek.com
  model: deepseek-v4-pro
  temperature: 0.2
  max_tokens: 24000
  timeout_seconds: 600
  thinking: disabled
  reasoning_effort: high

gemini:
  model: gemini-3.5-flash
  project:
  location: global
  api_version: v1
  temperature:
  thinking_level: high
  include_thoughts: false
  max_output_tokens: 65536
  timeout_seconds: 600
  application_credentials_file:

paths:
  raw_dir: data/raw
  processed_dir: data/processed/legal_flux
  runs_dir: runs/legal_flux
  reports_dir: reports/legal_flux
  prompts_dir: prompts
  schemas_dir: schemas
