[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legalflux"
version = "0.1.0"
description = "ReasonFlux-style adaptive template trajectories for LegalHK reasoning."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "datasets>=3.6,<4",
  "httpx>=0.28,<1",
  "json-repair>=0.30,<1",
  "jsonschema>=4.23,<5",
  "matplotlib>=3.9,<4",
  "numpy>=2.1,<3",
  "openai>=1.68,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18,<22",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
  "tenacity>=9,<10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
