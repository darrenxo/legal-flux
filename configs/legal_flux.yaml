project:
  seed: 20260619
  run_name: diagnostic

model:
  provider: ollama
  base_url: http://127.0.0.1:11434
  name: qwen3.5:9b
  context_length: 16384
  temperature: 0.0
  seed: 20260619
  analysis_max_tokens: 1000
  flux_plan_max_tokens: 900
  flux_step_max_tokens: 900
  flux_review_max_tokens: 500
  timeout_seconds: 600
  concurrency: 1

legal_flux:
  smoke_cases: 5
  split_fractions:
    template_source: 0.20
    planner_train: 0.50
    trajectory_dev: 0.15
    final_test: 0.15
  template_pool_target: 200-300
  max_steps: 4
  planner_train_samples: 4
  planner_train_temperature: 0.7
  planner_train_conditions:
    - flux_rf_style
  rf_retrieval_backend: ollama_embedding
  rf_embedding_model: bge-m3:latest
  rf_embedding_cache_file: data/processed/legal_flux/rf_template_embeddings_bge_m3.json
  rf_embedding_timeout_seconds: 600
  rf_tag_example_limit: 36
  include_authority_input: true
  force_binary_final_decision: true
  max_input_characters: 12000
  decision_overlap_ngram: 6
  decision_overlap_threshold: 0.12
  screen_explicit_outcome_leakage: false
  include_all_domains: true
  strict_fact_language_filter: false
  exclude_existing_legalhk_only_cases: false
  prior_legalhk_cases_file: data/processed/legalhk_only/cases.jsonl
  template_pool_file: templates/legal_flux_templates_v0.jsonl
  template_export_dir: reports/legal_flux/template_distillation
  chatgpt_batch_dir: reports/legal_flux/template_distillation/azure_gpt56_batches
  deepseek_template_dir: reports/legal_flux/template_distillation/deepseek_api
  gemini_template_dir: reports/legal_flux/template_distillation/gemini_api
  chatgpt_homogeneous_batches: 40
  chatgpt_mixed_batches: 10
  chatgpt_cases_per_batch: 80
  template_batch_full_coverage: true
  freeze_manifest_file: data/processed/legal_flux/legal_flux_frozen_manifest.json
  conditions:
    - direct
    - structured
    - flux_rf_style

audit:
  provider: none

deepseek:
  api_key_env: DEEPSEEK_API_KEY
  base_url: https://api.deepseek.com
  model: deepseek-v4-pro
  temperature: 0.2
  max_tokens: 24000
  timeout_seconds: 600
  thinking: disabled
  reasoning_effort: high

gemini:
  model: gemini-3.5-flash
  project:
  location: global
  api_version: v1
  temperature:
  thinking_level: high
  include_thoughts: false
  max_output_tokens: 65536
  timeout_seconds: 600
  application_credentials_file:

paths:
  raw_dir: data/raw
  processed_dir: data/processed/legal_flux
  runs_dir: runs/legal_flux
  reports_dir: reports/legal_flux
  prompts_dir: prompts
  schemas_dir: schemas
